# Ejemplo de configuración del motor (ut-llano-alianza-camunda/src/main/resources/application.yaml)
server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./camunda-h2-database
    username: sa
    password: sa

camunda:
  bpm:
    admin-user:
      id: demo
      password: demo
      first-name: Demo
    filter:
      create: All tasks
    deployment-resource-pattern:
      - classpath*:bpmn/*.bpmn
      - classpath*:dmn/*.dmn
      - classpath*:forms/*.form
